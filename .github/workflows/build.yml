name: Build
on:
  push:
    branches: [ master ]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: ./utils/build_locally.sh linux
      - name: Upload
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          git clone --depth 1 https://${{ secrets.GH_TOKEN }}@github.com/openturns/openturns.github.io.git /tmp/io
          mkdir -p /tmp/io/otmeshing/master
          cp -r html/* /tmp/io/otmeshing/master
          cd /tmp/io
          touch .nojekyll
          git config user.email "support@gh.com"
          git config user.name "GitHub Actions"
          git add -A .
          git commit -a -m "GitHub Actions build ${GITHUB_REPOSITORY} ${GITHUB_RUN_ID}" || exit 0
          git push --quiet origin master > /dev/null 2>&1

  mingw:
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: ./utils/build_locally.sh mingw

  mindeps:
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: ./utils/build_locally.sh mindeps

  macos:
    runs-on: macos-latest
    env:
      MAKEFLAGS: -j3
    steps:
    - uses: actions/checkout@v6
    - run: |
        brew update
        brew install openturns cddlib qhull coacd cgal
    - run: |
        cmake \
        -DCMAKE_INSTALL_PREFIX=~/.local \
        -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/openblas;/opt/homebrew/opt/libxml2" \
        -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror" \
        -DBUILD_PYTHON=OFF .
        make install
        make tests
        ctest ${MAKEFLAGS} --output-on-failure --timeout 200 --schedule-random
